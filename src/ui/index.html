<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header>
  <div class="logo">♟ ARBITER <span>// Tournament Manager</span></div>
  <div class="status-bar" id="statusBar">
    <span class="dot"></span>
    <span id="statusText">No tournament loaded</span>
  </div>
</header>

<div class="app">
  <nav>
    <div class="nav-section">Setup</div>
    <button class="nav-btn active" onclick="showPanel('load')" id="nav-load">
      <span class="icon">📂</span> Load Players
    </button>

    <div class="nav-section">Tournament</div>
    <button class="nav-btn" onclick="showPanel('rounds')" id="nav-rounds">
      <span class="icon">⚔</span> Rounds
    </button>
    <button class="nav-btn" onclick="showPanel('standings')" id="nav-standings">
      <span class="icon">🏆</span> Standings
    </button>
  </nav>

  <main>
    <!-- Load Players Panel -->
    <div class="panel active" id="panel-load">
      <div class="panel-title">Load <span>Players</span></div>

      <div class="card">
        <div class="card-label">From CSV File</div>
        <div class="field-row">
          <div class="field">
            <label>Selected File</label>
            <input type="text" id="csvPath" placeholder="No file selected…" readonly />
          </div>
          <button class="btn" onclick="browseFile()">Browse…</button>
          <button class="btn primary" onclick="loadPlayers()" id="btnLoad" disabled>Load</button>
        </div>
      </div>

      <div class="card" id="playersCard" style="display:none">
        <div class="card-label">Loaded Players</div>
        <div class="scrollable">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Rating</th>
              </tr>
            </thead>
            <tbody id="playersTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Rounds Panel -->
    <div class="panel" id="panel-rounds">
      <div class="panel-title">Round <span>Management</span></div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-value" id="statPlayers">—</div>
          <div class="stat-label">Players</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statRounds">—</div>
          <div class="stat-label">Rounds Played</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statGames">—</div>
          <div class="stat-label">Total Games</div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Actions</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn primary" onclick="generateRound()" id="btnGenerate">Generate Next Round</button>
        </div>
      </div>

      <div class="card" id="gamesCard" style="display:none">
        <div class="card-label">Games</div>
        <div class="round-tabs" id="roundTabs"></div>
        <div style="margin-top:16px;" class="scrollable">
          <table>
            <thead>
              <tr>
                <th>Game</th>
                <th>White</th>
                <th>Black</th>
                <th>Result</th>
                <th>Swap</th>
              </tr>
            </thead>
            <tbody id="gamesTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Standings Panel -->
    <div class="panel" id="panel-standings">
      <div class="panel-title">Current <span>Standings</span></div>
      <div class="card">
        <div class="scrollable">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Rating</th>
                <th>Points</th>
                <th>W</th><th>D</th><th>L</th>
              </tr>
            </thead>
            <tbody id="standingsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
